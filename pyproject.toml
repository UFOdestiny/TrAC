[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trac"
version = "1.0.0"
description = "TrAC: trace-conditioned answer consistency for uncertainty quantification in reasoning LLMs"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "scikit-learn>=1.5",
    "math-verify>=0.7",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
gpu = ["torch>=2.9", "transformers>=4.57", "vllm>=0.11"]
data = ["huggingface_hub>=0.24"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["trac*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E702", "E731", "E741"]

[tool.ruff.lint.per-file-ignores]
"trac/paper/tables.py" = ["E501"]   # LaTeX table templates
